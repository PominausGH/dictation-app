<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://analytics.daintytrading.com; connect-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Page not found — Voxtty</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<style>
  :root {
    --ground:#0B0E14; --surface:#12161F; --surface-2:#1A202B;
    --ink:#E9EDF3; --muted:#9BA7B6; --border:#232B38;
    --accent:#FF6A5A; --accent-ink:#FF8578; --teal:#43B8B2;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 2px 6px rgba(0,0,0,.3), 0 20px 50px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:#F2F4F7; --surface:#FFFFFF; --surface-2:#F9FAFB;
      --ink:#14181F; --muted:#57616E; --border:#E2E6EC;
      --accent:#DE4E3B; --accent-ink:#B63C2C; --teal:#0E7C7B;
      --shadow:0 1px 2px rgba(20,30,45,.05), 0 16px 40px rgba(20,30,45,.09);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; }
  .wrap { max-width:560px; margin:0 auto; padding:0 24px; text-align:center; }
  .brand { font-family:var(--mono); font-size:19px; font-weight:600; margin-bottom:28px; }
  .brand .tty { color:var(--teal); }
  .term { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden; text-align:left; margin-bottom:28px; }
  .term-bar { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border);
    background:var(--surface-2); }
  .dot { width:11px; height:11px; border-radius:50%; }
  .term-title { font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-left:8px; }
  .term-body { padding:20px 20px 26px; font-family:var(--mono); font-size:14px; line-height:1.85; }
  .term-body .p { color:var(--teal); }
  .term-body .c { color:var(--muted); }
  .term-body .err { color:var(--accent-ink); }
  h1 { font-size:clamp(28px,5vw,36px); letter-spacing:-.02em; margin:0 0 12px; }
  p { color:var(--muted); font-size:16px; margin:0 0 28px; }
  .btn { font-family:var(--mono); font-size:14.5px; font-weight:600; text-decoration:none;
    border-radius:10px; padding:13px 20px; display:inline-flex; align-items:center; gap:9px;
    background:#CE3E2B; color:#fff; }
  .btn:hover { filter:brightness(1.06); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">voxtty<span class="tty">.</span></div>
  <div class="term">
    <div class="term-bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="term-title">voxtty — ~</span>
    </div>
    <div class="term-body">
      <div><span class="p">$</span> cd /this-page</div>
      <div class="err">bash: cd: /this-page: No such file or directory</div>
      <div class="c"># 404 — nothing typed here</div>
    </div>
  </div>
  <h1>Page not found</h1>
  <p>That page doesn't exist. Let's get you back to the homepage.</p>
  <a class="btn" href="/">Back to voxtty.com →</a>
</div>
</body>
</html>
